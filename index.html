<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="abre aí" />
    <meta property="og:description" content="abre quando puder" />
    <meta property="og:type" content="website" />
    <title>abre aí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <main class="page-shell">
      <div class="hearts" aria-hidden="true">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
      </div>

      <section class="card" aria-labelledby="question-title">
        <div class="portrait">
          <img src="foto.jpg" alt="José" />
          <span aria-hidden="true">♥</span>
        </div>
        <h1 id="question-title">Anna, você aceita sair comigo?</h1>

        <div class="button-row" id="button-row">
          <button class="yes-button" id="yes-button" type="button" aria-controls="celebration" aria-expanded="false">Sim</button>
          <button class="no-button" id="no-button" type="button">Não</button>
        </div>
      </section>

      <section class="celebration" id="celebration" aria-live="polite" hidden>
        <div class="heart-rain" id="heart-rain" aria-hidden="true"></div>
        <div class="celebration-card">
          <p class="big-heart" aria-hidden="true">♥</p>
          <h2>Oba, Anna!</h2>
          <p>Escolhe uma data de dezembro para o nosso encontro.</p>

          <div class="date-picker">
            <label for="date-input">Quando vamos sair?</label>
            <input id="date-input" class="date-input" type="date" />
            <button class="mail-button" id="mail-button" type="button" disabled>
              Confirmar data
            </button>
            <p class="date-status" id="date-status" role="status">
              Selecione uma data de dezembro.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js?v=10"></script>
  </body>
</html>
